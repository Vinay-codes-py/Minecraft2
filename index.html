<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Voxel Engine</title>
    <style>
        /* CSS & DOM Overlay Setup */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Sky Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background-color 0.2s ease;
        }

        #instructions {
            text-align: center;
            color: #FFFFFF;
            cursor: pointer;
            padding: 20px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
        }

        #instructions h1 {
            font-size: 48px;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #333;
        }

        #instructions p {
            font-size: 18px;
            margin: 5px 0;
        }

        /* Center Target Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0px 0px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- UI Overlays -->
    <div id="blocker">
        <div id="instructions">
            <h1>Click to Play</h1>
            <p><b>W A S D</b> = Move | <b>SPACE</b> = Jump</p>
            <p><b>Left Click</b> = Break Block | <b>Right Click</b> = Place Block</p>
            <p><b>ESC</b> = Release Mouse</p>
        </div>
    </div>
    <div id="crosshair"></div>

    <!-- Three.js (r128) & PointerLockControls Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <!-- Main Game Engine Script -->
    <script>
        // ----------------------------------------------------
        // 1. CORE THREE.JS SETUP
        // ----------------------------------------------------
        let camera, scene, renderer, controls;
        let objects = []; // Array to store meshes for physics and raycasting
        
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerHeight = 1.6;

        // Prevent Right-Click Context Menu to allow block placement
        document.addEventListener('contextmenu', event => event.preventDefault());

        init();
        animate();

        function init() {
            // Scene & Fog Configuration
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 40); // Soften world edges

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // PointerLockControls Initialization
            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                blocker.style.display = 'flex';
                instructions.style.display = 'block';
            });

            scene.add(controls.getObject());
            controls.getObject().position.set(0, 15, 0); // High spawn point to drop in safely

            // Input Event Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (canJump === true) velocity.y += 10.0;
                        canJump = false;
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // ----------------------------------------------------
            // 2. PROCEDURAL MATERIALS & GEOMETRY
            // ----------------------------------------------------
            const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

            // Base Materials (Roughness and Metallic simulated via Lambert/Standard defaults)
            const dirtMat = new THREE.MeshLambertMaterial({ color: 0x6E4723 });
            const stoneMat = new THREE.MeshLambertMaterial({ color: 0x7A7A7A });
            const grassTopMat = new THREE.MeshLambertMaterial({ color: 0x557A2B });

            // Multi-Material for Grass Block (Right, Left, Top, Bottom, Front, Back)
            const grassMaterial = [
                dirtMat,      // Right side
                dirtMat,      // Left side
                grassTopMat,  // Top side
                dirtMat,      // Bottom side
                dirtMat,      // Front side
                dirtMat       // Back side
            ];

            // ----------------------------------------------------
            // 3. PROCEDURAL LANDSCAPE GENERATION (Sine/Cosine Math)
            // ----------------------------------------------------
            for (let x = -20; x <= 20; x++) {
                for (let z = -20; z <= 20; z++) {
                    // Height calculation using mathematical waves
                    let height = Math.floor(Math.sin(x / 5) * 3 + Math.cos(z / 4) * 2);
                    
                    // Column Generation
                    for (let y = height - 4; y <= height; y++) {
                        let materialToUse;
                        if (y === height) {
                            materialToUse = grassMaterial; // Surface
                        } else if (y > height - 3) {
                            materialToUse = dirtMat;       // Sub-surface
                        } else {
                            materialToUse = stoneMat;      // Deep layer
                        }

                        const voxel = new THREE.Mesh(boxGeometry, materialToUse);
                        voxel.position.set(x, y, z);
                        voxel.castShadow = true;
                        voxel.receiveShadow = true;
                        scene.add(voxel);
                        objects.push(voxel);
                    }
                }
            }

            // ----------------------------------------------------
            // 4. PROCEDURAL PLAYER SKIN MODEL (NPC)
            // ----------------------------------------------------
            // Assemble a player model out of blocks and place it in front of the spawn
            const npcGroup = new THREE.Group();
            
            // Materials for NPC
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xC58C66 });
            const shirtMat = new THREE.MeshLambertMaterial({ color: 0x00A8A8 });
            const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2C3E50 });

            // Head
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const headMesh = new THREE.Mesh(headGeo, skinMat);
            headMesh.position.y = 2.75;
            headMesh.castShadow = true;
            npcGroup.add(headMesh);

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.5, 0.75, 0.25);
            const torsoMesh = new THREE.Mesh(torsoGeo, shirtMat);
            torsoMesh.position.y = 2.125;
            torsoMesh.castShadow = true;
            npcGroup.add(torsoMesh);

            // Legs
            const legsGeo = new THREE.BoxGeometry(0.5, 0.75, 0.25);
            const legsMesh = new THREE.Mesh(legsGeo, pantsMat);
            legsMesh.position.y = 1.375;
            legsMesh.castShadow = true;
            npcGroup.add(legsMesh);

            // Position NPC on top of the terrain at specific coordinates (x: 0, z: -5)
            let npcBaseY = Math.floor(Math.sin(0 / 5) * 3 + Math.cos(-5 / 4) * 2);
            npcGroup.position.set(0, npcBaseY, -5);
            scene.add(npcGroup);

            // ----------------------------------------------------
            // 5. BLOCK BREAKING & PLACING MECHANICS
            // ----------------------------------------------------
            document.addEventListener('mousedown', (event) => {
                if (!controls.isLocked) return;

                // Center Raycaster
                const clickRaycaster = new THREE.Raycaster();
                clickRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                
                const intersects = clickRaycaster.intersectObjects(objects);

                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    
                    // Maximum interaction reach limit (6 units)
                    if (intersect.distance > 6) return;

                    if (event.button === 0) {
                        // LEFT CLICK: Break Block
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                    } else if (event.button === 2) {
                        // RIGHT CLICK: Place Grass Block
                        const voxel = new THREE.Mesh(boxGeometry, grassMaterial);
                        // Calculate position by snapping to the face normal
                        voxel.position.copy(intersect.object.position).add(intersect.face.normal);
                        voxel.castShadow = true;
                        voxel.receiveShadow = true;
                        scene.add(voxel);
                        objects.push(voxel);
                    }
                }
            });

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ----------------------------------------------------
        // 6. MAIN ANIMATION & PHYSICS LOOP
        // ----------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000; // Delta time in seconds

                // Damping/Friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                // Gravity Simulation
                velocity.y -= 9.8 * 5.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Ensure consistent diagonal speed

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                // Floor Collision Detection via Downward Raycaster
                const currentPosition = controls.getObject().position;
                const physicsRaycaster = new THREE.Raycaster(currentPosition, new THREE.Vector3(0, -1, 0), 0, playerHeight + 0.1);
                
                const intersections = physicsRaycaster.intersectObjects(objects);
                const onObject = intersections.length > 0;

                // Stop falling if hitting a block
                if (onObject && velocity.y < 0) {
                    velocity.y = 0;
                    canJump = true;
                    // Snap position precisely to top of the block
                    controls.getObject().position.y = intersections[0].point.y + playerHeight;
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += velocity.y * delta;

                // Fall-net Teleport System (Respawn if player falls into the void)
                if (controls.getObject().position.y < -20) {
                    velocity.y = 0;
                    controls.getObject().position.set(0, 15, 0);
                }

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
